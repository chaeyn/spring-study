<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="/main.css">
  <title>Document</title>
</head>
<body>
<div th:replace="~{nav.html :: navbar}"></div>
<div class="detail">
  <h4>상세페이지</h4>
  <img id="img-detail-view" th:src="${item.imgUrl}">
  <h4 th:text="${item.title}">금도금 바지</h4>
  <p th:text="${item.price + '원'}">7억</p>
</div>
</body>

<script>
  const imgDetailView = document.getElementById("img-detail-view");
  imgDetailView.style.width = "300px";
  imgDetailView.style.height = "300px";

  if (imgDetailView.src === null) {
    imgDetailView.src = "https://placehold.co/300";
  }
</script>

</html>
